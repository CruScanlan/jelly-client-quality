# Builds a plugin release and publishes it to the plugin repository manifest.
#
# Trigger it by pushing a version tag (git tag v1.0.1.0 && git push origin v1.0.1.0)
# or from the Actions tab (Run workflow, enter the version).
#
# Jellyfin reads the manifest from the `manifest` branch:
#   https://raw.githubusercontent.com/<owner>/<repo>/manifest/manifest.json
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then raw="$INPUT_VERSION"; else raw="$GITHUB_REF_NAME"; fi
          raw="${raw#v}"
          if ! [[ "$raw" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::'$raw' is not a version like 1.0.1.0"
            exit 1
          fi
          # Jellyfin plugin versions have four parts; pad 1.2 or 1.2.3 with zeros.
          IFS=. read -ra parts <<< "$raw"
          while [ "${#parts[@]}" -lt 4 ]; do parts+=(0); done
          version="$(IFS=.; echo "${parts[*]}")"
          if [ "$EVENT" = workflow_dispatch ]; then tag="v$version"; else tag="$GITHUB_REF_NAME"; fi

          yq -o=json build.yaml > "$RUNNER_TEMP/build.json"
          slug="$(jq -r '.name' "$RUNNER_TEMP/build.json" | tr '[:upper:] ' '[:lower:]-')"
          {
            echo "VERSION=$version"
            echo "TAG=$tag"
            echo "ZIP=${slug}_${version}.zip"
          } >> "$GITHUB_ENV"
          echo "Releasing $version as $tag"

      - name: Test
        run: dotnet test -c Release

      - name: Build
        run: >
          dotnet publish Jellyfin.Plugin.ClientQuality -c Release -o artifacts
          -p:Version=$VERSION -p:AssemblyVersion=$VERSION -p:FileVersion=$VERSION

      - name: Package
        run: |
          # Zip only the files build.yaml lists; the server supplies Jellyfin's own assemblies.
          jq -r '.artifacts[]' "$RUNNER_TEMP/build.json" > "$RUNNER_TEMP/artifacts.txt"
          (cd artifacts && zip -X "../$ZIP" -@ < "$RUNNER_TEMP/artifacts.txt")
          unzip -l "$ZIP"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            jq -r '.changelog // ""' "$RUNNER_TEMP/build.json" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "$(jq -r '.name' "$RUNNER_TEMP/build.json") $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Update manifest
        run: |
          dir="$RUNNER_TEMP/manifest"
          if git fetch --depth=1 origin manifest:refs/remotes/origin/manifest; then
            git worktree add -B manifest "$dir" origin/manifest
          else
            git worktree add --orphan -b manifest "$dir"
          fi

          python3 scripts/update_manifest.py \
            --manifest "$dir/manifest.json" \
            --build-json "$RUNNER_TEMP/build.json" \
            --zip "$ZIP" \
            --version "$VERSION" \
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$ZIP"

          cd "$dir"
          git add manifest.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Publish $VERSION to the plugin manifest"
          git push origin manifest
